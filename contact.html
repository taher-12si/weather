<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container mt-5">
    <h1 class="text-center mb-4">Contact Us</h1>
    <form id="contact-form">
      <div class="row">
        <div class="col-md-6 mb-3">
          <input type="text" class="form-control" id="name" placeholder="Your name..." required>
        </div>
        <div class="col-md-6 mb-3">
          <input type="email" class="form-control" id="email" placeholder="Email address..." required>
        </div>
        <div class="col-md-6 mb-3">
          <input type="text" class="form-control" placeholder="Company name...">
        </div>
        <div class="col-md-6 mb-3">
          <input type="text" class="form-control" placeholder="Website...">
        </div>
        <div class="col-12 mb-3">
          <textarea class="form-control" id="message" rows="4" placeholder="Message..." required></textarea>
        </div>
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white pt-5 pb-3 mt-5">
    <div class="container">
      <div class="row">
        <div class="col-md-4 mb-4">
          <h5>Company Name INC.</h5>
          <p>2803 Avenue Street, Los Angeles</p>
          <p><i class="fas fa-phone-alt me-2"></i> +1 800 312 295</p>
          <p><i class="fas fa-envelope me-2"></i> contact@companyname.com</p>
        </div>
        <div class="col-md-4 mb-4">
          <h5>Subscribe</h5>
          <form>
            <div class="input-group">
              <input type="email" class="form-control" placeholder="Enter your email to subscribe...">
              <button class="btn btn-primary" type="submit">Submit</button>
            </div>
          </form>
        </div>
        <div class="col-md-4 mb-4 text-center text-md-end">
          <h5>Follow us</h5>
          <div class="social-icons mt-2">
            <a href="#" class="text-white me-3"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="text-white me-3"><i class="fab fa-twitter"></i></a>
            <a href="#" class="text-white me-3"><i class="fab fa-instagram"></i></a>
            <a href="#" class="text-white"><i class="fab fa-linkedin-in"></i></a>
          </div>
        </div>
      </div>
      <hr class="bg-light">
      <div class="text-center small">
        Copyright © 2025 Company name. Designed by Themosy. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="contact.js"></script>
</body>
</html>
