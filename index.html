<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
          <div class="logo">Weather <span class="tagline"></span></div>
          <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">News</a>
            <a href="#">Live cameras</a>
            <a href="#">Photos</a>
            <a href="#">Contact</a>
          </nav>
          <div class="search-box">
            <input type="text" placeholder="Find your location...">
            <button class="find-btn">Find</button>
          </div>
        </div>
      </header>

  <div class="weather-widget">
    <div class="weather-day">
      <div class="weather-icon">
        <i class="fas fa-cloud-sun fa-2x"></i>
      </div>
      <div class="weather-info">
        <p class="weather-status">Partly cloudy</p>
        <div class="weather-details">
          <span><i class="fas fa-tint"></i> 20%</span>
          <span><i class="fas fa-wind"></i> 18km/h</span>
          <span><i class="fas fa-compass"></i> East</span>
        </div>
      </div>
    </div>

    <div class="weather-day">
      <div class="weather-icon">
        <i class="fas fa-sun fa-2x"></i>
      </div>
      <div class="weather-info">
        <p class="weather-status">Sunny</p>
      </div>
    </div>

    <div class="weather-day">
      <div class="weather-icon">
        <i class="fas fa-sun fa-2x"></i>
      </div>
      <div class="weather-info">
        <p class="weather-status">Sunny</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="subscribe-box">
      <input type="email" placeholder="Enter your email to subscribe...">
      <button class="subscribe-btn">Subscribe</button>
    </div>
    <p class="footer-text">Copyright 2014 Company name. Designed by Themezy. All rights reserved</p>
    <div class="social-icons">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-google-plus-g"></i></a>
      <a href="#"><i class="fab fa-pinterest-p"></i></a>
    </div>
  </footer>

</body>
</html>
